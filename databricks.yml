# Declarative Automation Bundle for the retail lakeflow project.
# Bronze (multi-region Auto Loader) -> Silver (clean/dedupe) -> Gold (daily sales MV)

bundle:
  name: retail-lakeflow-project

# Landing data stays outside the bundle; only source code is deployed.
sync:
  exclude:
    - data/
    - README.me

variables:
  catalog:
    description: Unity Catalog holding the retail_bronze / retail_silver / retail_gold schemas
    default: main
  pipeline_name:
    description: Name of the Spark Declarative Pipeline
    default: retail_lakeflow

targets:
  dev:
    description: Personal development deployment
    default: true

resources:
  pipelines:
    retail_lakeflow:
      name: ${var.pipeline_name}

      # All tables in the code use fully qualified names
      # (main.retail_bronze / main.retail_silver / main.retail_gold)
      catalog: ${var.catalog}

      # Include only the pipeline sources; the SQL files under
      # 00_setup and the bronze .sql copy are setup scripts,
      # not pipeline code, and would break the update if loaded.
      libraries:
        - glob:
            include:
              - src/01_bronze/**
              - src/02_silver/**
              - src/03_gold/**
            exclude:
              - src/01_bronze/orders_bronze.sql

      serverless: true
      photon: true
      channel: current
      development: true

      permissions:
        - level: CAN_VIEW
          group_name: users
