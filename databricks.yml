# Declarative Automation Bundle for the retail lakeflow project.
# Bronze (multi-region Auto Loader) -> Silver (clean/dedupe) -> Gold (daily sales MV)

bundle:
  name: retail-lakeflow-project

# Landing data stays outside the bundle; only source code is deployed.
sync:
  exclude:
    - ./data/**
    - README.me

variables:
  catalog:
    description: Unity Catalog holding the retail_bronze / retail_silver / retail_gold schemas
    default: main
  pipeline_name:
    description: Name of the Spark Declarative Pipeline
    default: retail_lakeflow

targets:
  dev:
    mode: development
    default: true

resources:
  pipelines:
    retail_lakeflow:
      name: ${var.pipeline_name}

      # All tables in the code use fully qualified names
      # (main.retail_bronze / main.retail_silver / main.retail_gold)
      catalog: ${var.catalog}

      # Explicit file libraries: the SQL files under 00_setup and
      # 01_bronze are setup scripts, not pipeline code, and would
      # break the update if loaded as pipeline sources.
      libraries:
        - file:
            path: src/01_bronze/orders_bronze.py
        - file:
            path: src/02_silver/orders_silver.py
        - file:
            path: src/03_gold/daily_sales.py

      serverless: true
      photon: true
      channel: current

      permissions:
        - level: CAN_VIEW
          group_name: users
